name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: dotnet test --project tests\ConflictStudio.Core.Tests\ConflictStudio.Core.Tests.csproj --configuration Release
      - run: dotnet test --project tests\ConflictStudio.App.Tests\ConflictStudio.App.Tests.csproj --configuration Release
      - run: node --test integrations\vortex\bridge.test.js integrations\vortex\index.test.js
